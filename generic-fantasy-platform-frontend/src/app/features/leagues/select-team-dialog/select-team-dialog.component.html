<h2 mat-dialog-title>Join {{ data.leagueName }}</h2>

<mat-dialog-content>
  <p>Choose which of your teams should join this league.</p>
  <mat-nav-list>
    @for (team of data.teams; track team.id) {
      <a mat-list-item (click)="choose(team)">
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle>{{ team.name }}</span>
      </a>
    }
    <a mat-list-item (click)="createNew()">
      <mat-icon matListItemIcon>add_circle</mat-icon>
      <span matListItemTitle>Create a new team</span>
    </a>
  </mat-nav-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
</mat-dialog-actions>
