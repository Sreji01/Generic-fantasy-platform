<mat-toolbar color="primary">
  <button mat-icon-button (click)="goBack()" aria-label="Back to fantasy game">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Standings — {{ league()?.name }}</span>
</mat-toolbar>

<div class="content">
  @if (forbidden()) {
    <p class="empty-state">Join this league to view its standings.</p>
  } @else if (standings().length > 0) {
    <table mat-table [dataSource]="standings()" class="mat-elevation-z1">
      <ng-container matColumnDef="rank">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let entry">{{ entry.rank }}</td>
      </ng-container>

      <ng-container matColumnDef="fantasyTeamName">
        <th mat-header-cell *matHeaderCellDef>Team</th>
        <td mat-cell *matCellDef="let entry">{{ entry.fantasyTeamName }}</td>
      </ng-container>

      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Owner</th>
        <td mat-cell *matCellDef="let entry">{{ entry.username }}</td>
      </ng-container>

      <ng-container matColumnDef="totalPoints">
        <th mat-header-cell *matHeaderCellDef>Points</th>
        <td mat-cell *matCellDef="let entry">{{ entry.totalPoints ?? 0 }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  } @else {
    <p class="empty-state">No teams have joined this league yet.</p>
  }
</div>
