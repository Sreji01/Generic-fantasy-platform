<mat-toolbar color="primary">
  <button mat-icon-button (click)="goHome()" aria-label="Back to home">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Fantasy Games</span>
  <span class="spacer"></span>
  <button mat-flat-button (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Create Fantasy Game
  </button>
</mat-toolbar>

<div class="content">
  <table mat-table [dataSource]="fantasyGames()" class="mat-elevation-z1">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let fantasyGame">{{ fantasyGame.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let fantasyGame">{{ fantasyGame.description || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="createdBy">
      <th mat-header-cell *matHeaderCellDef>Created By</th>
      <td mat-cell *matCellDef="let fantasyGame">{{ fantasyGame.createdByUsername }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let fantasyGame">
        <button mat-icon-button (click)="openDetails(fantasyGame)" aria-label="View details">
          <mat-icon>visibility</mat-icon>
        </button>
        @if (canModify(fantasyGame)) {
          <button mat-icon-button (click)="openFieldBuilder(fantasyGame)" aria-label="Configure field">
            <mat-icon>grid_on</mat-icon>
          </button>
          <button mat-icon-button (click)="openEditDialog(fantasyGame)" aria-label="Edit fantasy game">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteFantasyGame(fantasyGame)" aria-label="Delete fantasy game">
            <mat-icon>delete</mat-icon>
          </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  @if (fantasyGames().length === 0) {
    <p class="empty-state">No fantasy games yet. Create one to get started.</p>
  }
</div>
